idempotency:
  supported: null
  header: null
  note: >-
    No idempotency key, retry-safety, or deduplication contract is documented for the HTTP API.
    NOTE: 11x does document deduplication at the CRM-integration layer — a "Deduplicate" toggle
    that prevents multiple calls to the same phone number, plus a "Deduplication Time Buffer"
    after which a previously-called prospect may be contacted again. That is a business-level
    call-suppression control, NOT an API idempotency contract, and it is deliberately not wired
    as an `Idempotency` pointer.

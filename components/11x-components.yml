- name: PersonaClient browser client
  kind: javascript-embed
  description: >-
    A script-tag-loaded JavaScript client that embeds an 11x conversational agent into a customer
    web application. The host page injects the loader script with its 11x key, constructs a
    PersonaClient, initializes a chat session against a configured agent (personaId), and drives
    the session lifecycle from the page.
  loader:
    url: https://api.prod.centralus.az.sindarin.tech/PersonaClientPublicV2
    query: apikey=<YOUR_11X_KEY>
    global: window.PersonaClient.default
    vendor: Sindarin (api.prod.centralus.az.sindarin.tech)
    vendor_note: >-
      The loader is served from a third-party vendor host, not from an 11x-owned domain. Recorded
      as published; this is 11x's own documented installation snippet.
  configuration:
  - {name: personaId, required: true, description: identifies the agent to run}
  - {name: userId, required: false, description: caller-supplied user identifier}
  - {name: personaName, required: false}
  - name: details
    required: false
    description: 'arbitrary object injected into the agent as {{details.x}}'
  - {name: options.debugMode, required: false}
  - {name: options.streamTranscripts, required: false}
  - {name: options.shouldNotSaveConversation, required: false}
  methods:
  - {name: init, description: start a chat session with the configured agent}
  - {name: pause, description: pause the chat}
  - {name: resume, description: resume the chat}
  - {name: end, description: end the chat}
  events:
  - {name: messages_update, description: message list changed}
  - {name: state_updated, description: session state changed}
  - {name: action, description: agent emitted an action}
  source: https://11x.mintlify.app/integrations/mike-browser-implementation

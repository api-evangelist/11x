  description: 'A single API surface across Alice (outbound) and Julian (inbound/voice) that
    triggers outbound campaigns, inbound qualification, and meeting booking from any system in the
    customer stack, pushes data in and pulls structured results out, and emits webhooks for
    real-time automation. The API is marketed on the 11x platform pages but no public reference,
    endpoint list, or machine-readable specification is published; the API host api.11x.ai returns
    HTTP 403 to anonymous requests. Access is arranged through the sales/demo motion.'

aid: 11x
name: 11x
description: '11x builds autonomous AI "digital workers" for revenue teams — Alice, an outbound
  AI SDR that prospects, researches, and runs multi-channel email and LinkedIn outreach against a
  400M+ B2B contact database, and Julian, an inbound AI phone, chat, and SMS rep that qualifies
  leads and books meetings in real time. The company markets a single unified platform API across
  both workers for triggering outbound, inbound, and meeting booking from external systems, plus
  webhooks and native bi-directional Salesforce, HubSpot, and Zoho CRM sync brokered over OAuth via
  Ampersand. Founded in 2023 with offices in San Francisco and London, 11x has raised roughly $75M
  across Seed, Series A (Benchmark Capital) and Series B (Andreessen Horowitz), with participation
  from HubSpot Ventures, Abstract Ventures, and 20VC. The platform API reference and any
  machine-readable specification are not published publicly — api.11x.ai answers anonymous requests
  with HTTP 403 and the marketing API page routes to a sales demo rather than a developer reference.'
